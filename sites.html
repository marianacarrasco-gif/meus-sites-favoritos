<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Título exibido na aba do navegador -->
    <title>Meus sites favoritos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #1a2a3a;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .card a {
            display: inline-block;
            text-decoration: none;
            background-color: #0066cc;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
        }

        .card a:hover {
            background-color: #004b99;
        }
    </style>
</head>
<body>

    <!-- Título do corpo da página -->
    <h1>Meus sites favoritos: Mariana Carrasco de Moura</h1>
    <!-- Construindo itens e links com imagen para cada site-->
    <div class="container">

        <!-- Item 1: Gmail -->
        <div class="card">
            <h2>Gmail</h2>
            <img src="gmail.png" alt="Logotipo do Gmail">
            <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer">Acessar o Gmail</a>
        </div>

        <!-- Item 2: UOL -->
        <div class="card">
            <h2>UOL</h2>
            <img src="uol.png" alt="Logotipo do UOL">
            <a href="https://www.uol.com.br" target="_blank" rel="noopener noreferrer">Acessar o UOL</a>
        </div>

        <!-- Item 3: Amazon -->
        <div class="card">
            <h2>Amazon</h2>
            <img src="amazon.jpg" alt="Logotipo da Amazon">
            <a href="https://www.amazon.com.br" target="_blank" rel="noopener noreferrer">Acessar a Amazon</a>
        </div>

        <!-- Item 4: YouTube -->
        <div class="card">
            <h2>YouTube</h2>
            <img src="youtube.png" alt="Logotipo do YouTube">
            <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Acessar o YouTube</a>
        </div>

        <!-- Item 5: Instagram -->
        <div class="card">
            <h2>Instagram</h2>
            <img src="instagram.png" alt="Logotipo do Instagram">
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Acessar o Instagram</a>
        </div>

    </div>

</body>
</html>
